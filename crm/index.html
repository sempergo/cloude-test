<!doctype html>
<html lang="de" class="dark">
<head>

  <meta name="theme-color" content="#09090b" />
  <title>semp — CRM</title>
  <link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2309090b'/><text x='16' y='22' text-anchor='middle' font-family='Inter,sans-serif' font-weight='700' font-size='16' fill='%23ffffff'>s</text></svg>" />

    tailwind.config = {

        extend: {

            'pulse-red': 'pulse-red 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',

              '50%': { boxShadow: '0 0 0 6px rgba(239, 68, 68, 0)' },

        },
      },

<body class="min-h-screen bg-zinc-950 text-zinc-100">

<!-- ============================ LOGIN ============================ -->
<section id="login-screen" class="hidden fixed inset-0 z-50 flex items-center justify-center px-4 bg-zinc-950">
  <div class="w-full max-w-sm">
    <div class="text-center mb-10">
      <div class="inline-flex items-center gap-2 mb-6">
        <div class="w-10 h-10 rounded-xl bg-white text-zinc-950 flex items-center justify-center font-bold text-lg">s</div>

      <h1 class="text-2xl font-semibold tracking-tight">semp — CRM</h1>
      <p class="text-zinc-400 text-sm mt-2">Sales-Pipeline. Nichts geht verloren.</p>
    </div>
    <form id="login-form" novalidate class="space-y-3">
      <div>
        <label class="block text-xs font-medium text-zinc-400 mb-1.5">Email</label>
        <input type="email" id="login-email" autocomplete="email"
          class="w-full px-3.5 py-2.5 rounded-lg bg-zinc-900 border border-zinc-800 focus:border-zinc-600 focus:outline-none text-sm" />
      </div>
      <div>
        <label class="block text-xs font-medium text-zinc-400 mb-1.5">Passwort</label>
        <input type="password" id="login-password" autocomplete="current-password"
          class="w-full px-3.5 py-2.5 rounded-lg bg-zinc-900 border border-zinc-800 focus:border-zinc-600 focus:outline-none text-sm" />
      </div>
      <div id="login-error" class="hidden text-xs text-red-400 px-1"></div>
      <button type="submit" id="login-submit"
        class="w-full mt-2 px-3.5 py-2.5 rounded-lg bg-white text-zinc-950 font-medium text-sm hover:bg-zinc-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
        Anmelden
      </button>
    </form>
    <p class="text-center text-xs text-zinc-600 mt-8">semp studios · interne Nutzung</p>
  </div>
</section>

<!-- ============================ APP ============================ -->

      <div class="flex-1 min-w-0">

      </button>
    </div>

    <div class="flex-1 overflow-y-auto scrollbar-thin">

      <div class="px-5 py-4 border-b border-zinc-900">

        <div id="detail-status-buttons" class="grid grid-cols-3 gap-1.5"></div>
      </div>

      <!-- ACTIVITIES BLOCK -->
      <div class="px-5 py-4 border-b border-zinc-900">

            Neu
          </button>
        </div>
        <div id="activities-warning"></div>
        <div id="activities-open" class="space-y-2"></div>
        <div id="activities-done-toggle" class="hidden mt-4">
          <button onclick="toggleDoneActivities()" class="text-xs text-zinc-500 hover:text-zinc-300 transition-colors flex items-center gap-1">
            <svg id="activities-done-chevron" class="w-3 h-3 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
            <span id="activities-done-label">Erledigte anzeigen</span>
          </button>
        </div>
        <div id="activities-done" class="hidden space-y-1.5 mt-3"></div>
      </div>

      <div id="detail-quick-actions" class="px-5 py-4 border-b border-zinc-900 grid grid-cols-2 sm:grid-cols-4 gap-2"></div>

      <div class="px-5 py-4 border-b border-zinc-900 space-y-3">
        <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider">Stammdaten</label>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-[10px] font-medium text-zinc-500 mb-1">Branche</label>
            <input type="text" id="detail-branche" class="detail-field w-full px-2.5 py-1.5 rounded-md bg-zinc-900 border border-zinc-800 focus:border-zinc-700 focus:outline-none text-sm" />
          </div>
          <div>
            <label class="block text-[10px] font-medium text-zinc-500 mb-1">Kontaktperson</label>
            <input type="text" id="detail-kontaktperson" class="detail-field w-full px-2.5 py-1.5 rounded-md bg-zinc-900 border border-zinc-800 focus:border-zinc-700 focus:outline-none text-sm" />
          </div>
          <div>
            <label class="block text-[10px] font-medium text-zinc-500 mb-1">Telefon</label>
            <input type="tel" id="detail-telefon" placeholder="+49…" class="detail-field w-full px-2.5 py-1.5 rounded-md bg-zinc-900 border border-zinc-800 focus:border-zinc-700 focus:outline-none text-sm" />
          </div>
          <div>
            <label class="block text-[10px] font-medium text-zinc-500 mb-1">Email</label>
            <input type="text" id="detail-email" class="detail-field w-full px-2.5 py-1.5 rounded-md bg-zinc-900 border border-zinc-800 focus:border-zinc-700 focus:outline-none text-sm" />
          </div>
          <div class="col-span-2">
            <label class="block text-[10px] font-medium text-zinc-500 mb-1">Alte Website</label>
            <input type="text" id="detail-alte-website" placeholder="https://…" class="detail-field w-full px-2.5 py-1.5 rounded-md bg-zinc-900 border border-zinc-800 focus:border-zinc-700 focus:outline-none text-sm" />
          </div>
          <div class="col-span-2">
            <label class="block text-[10px] font-medium text-zinc-500 mb-1">Unsere Website</label>
            <input type="text" id="detail-website-url" placeholder="https://sempergo.github.io/semp-studios/clients/…" class="detail-field w-full px-2.5 py-1.5 rounded-md bg-zinc-900 border border-zinc-800 focus:border-zinc-700 focus:outline-none text-sm" />
          </div>
        </div>
      </div>

      <div class="px-5 py-4 border-b border-zinc-900">
        <label class="block text-xs font-medium text-zinc-500 uppercase tracking-wider mb-3">Allgemeine Notizen</label>
        <div class="flex gap-2 mb-4">
          <input type="text" id="new-note-input" placeholder="Schnelle Lead-Notiz…"
            class="flex-1 px-3 py-2 rounded-lg bg-zinc-900 border border-zinc-800 focus:border-zinc-700 focus:outline-none text-sm" />
          <button id="add-note-btn" class="px-3 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 transition-colors text-sm font-medium">
            Hinzufügen
          </button>
        </div>
        <div id="notes-timeline" class="space-y-2.5"></div>
      </div>

      <div class="px-5 py-4">
        <div id="delete-restore-area"></div>
      </div>

    </div>

  <!-- ADD LEAD MODAL -->
  <div id="add-lead-modal" class="hidden fixed inset-0 z-50 bg-zinc-950/70 backdrop-blur-sm flex items-center justify-center px-4">

      <div class="px-5 py-4 border-b border-zinc-800 flex items-center justify-between">
        <h2 class="font-semibold">Neuer Lead</h2>
        <button onclick="closeAddLead()" class="p-1 rounded-md hover:bg-zinc-800 transition-colors">
          <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="add-lead-form" novalidate class="p-5 space-y-3">
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">Firma *</label>
          <input type="text" id="new-firma" autofocus
            class="w-full px-3 py-2 rounded-lg bg-zinc-950 border border-zinc-800 focus:border-zinc-600 focus:outline-none text-sm" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1">Branche</label>
            <input type="text" id="new-branche" class="w-full px-3 py-2 rounded-lg bg-zinc-950 border border-zinc-800 focus:border-zinc-600 focus:outline-none text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1">Kontaktperson</label>
            <input type="text" id="new-kontaktperson" class="w-full px-3 py-2 rounded-lg bg-zinc-950 border border-zinc-800 focus:border-zinc-600 focus:outline-none text-sm" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1">Telefon</label>
            <input type="tel" id="new-telefon" placeholder="+49…" class="w-full px-3 py-2 rounded-lg bg-zinc-950 border border-zinc-800 focus:border-zinc-600 focus:outline-none text-sm" />
          </div>
          <div>
            <label class="block text-xs font-medium text-zinc-400 mb-1">Email</label>
            <input type="text" id="new-email" class="w-full px-3 py-2 rounded-lg bg-zinc-950 border border-zinc-800 focus:border-zinc-600 focus:outline-none text-sm" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">Alte Website</label>
          <input type="text" id="new-alte-website" placeholder="https://…" class="w-full px-3 py-2 rounded-lg bg-zinc-950 border border-zinc-800 focus:border-zinc-600 focus:outline-none text-sm" />
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1">Unsere Website</label>
          <input type="text" id="new-website-url" placeholder="https://sempergo.github.io/semp-studios/clients/…" class="w-full px-3 py-2 rounded-lg bg-zinc-950 border border-zinc-800 focus:border-zinc-600 focus:outline-none text-sm" />
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" onclick="closeAddLead()" class="flex-1 px-3 py-2 rounded-lg border border-zinc-800 hover:bg-zinc-800 transition-colors text-sm">Abbrechen</button>
          <button type="submit" class="flex-1 px-3 py-2 rounded-lg bg-white text-zinc-950 font-medium hover:bg-zinc-200 transition-colors text-sm">Anlegen</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ACTIVITY MODAL -->
  <div id="activity-modal" class="hidden fixed inset-0 z-50 bg-zinc-950/70 backdrop-blur-sm flex items-center justify-center px-4">
    <div class="w-full max-w-md bg-zinc-900 border border-zinc-800 rounded-2xl shadow-2xl max-h-[90vh] overflow-y-auto scrollbar-thin">
      <div class="px-5 py-4 border-b border-zinc-800 flex items-center justify-between sticky top-0 bg-zinc-900">
        <h2 id="activity-modal-title" class="font-semibold">Neue Aktivität</h2>
        <button onclick="closeActivityModal()" class="p-1 rounded-md hover:bg-zinc-800 transition-colors">
          <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <form id="activity-form" novalidate class="p-5 space-y-4">
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Titel *</label>
          <input type="text" id="activity-titel" autofocus placeholder="z.B. Anruf wegen Logo / Termin Café"
            class="w-full px-3 py-2 rounded-lg bg-zinc-950 border border-zinc-800 focus:border-zinc-600 focus:outline-none text-sm" />
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Datum &amp; Uhrzeit</label>
          <input type="datetime-local" id="activity-scheduled-at"
            class="w-full px-3 py-2 rounded-lg bg-zinc-950 border border-zinc-800 focus:border-zinc-600 focus:outline-none text-sm mb-2" />
          <div class="grid grid-cols-2 gap-1.5">
            <button type="button" data-activity-quick="tomorrow10" class="px-2.5 py-1.5 rounded-md bg-zinc-950 border border-zinc-800 hover:border-zinc-700 text-xs text-zinc-300 transition-colors">Morgen 10 Uhr</button>
            <button type="button" data-activity-quick="in3days" class="px-2.5 py-1.5 rounded-md bg-zinc-950 border border-zinc-800 hover:border-zinc-700 text-xs text-zinc-300 transition-colors">In 3 Tagen</button>
            <button type="button" data-activity-quick="nextweek" class="px-2.5 py-1.5 rounded-md bg-zinc-950 border border-zinc-800 hover:border-zinc-700 text-xs text-zinc-300 transition-colors">Nächste Woche</button>
            <button type="button" data-activity-quick="clear" class="px-2.5 py-1.5 rounded-md bg-zinc-950 border border-zinc-800 hover:border-zinc-700 text-xs text-zinc-500 transition-colors">Datum löschen</button>
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium text-zinc-400 mb-1.5">Notiz</label>
          <textarea id="activity-note" rows="4" placeholder="Was ist zu tun? Was wurde besprochen?"
            class="w-full px-3 py-2 rounded-lg bg-zinc-950 border border-zinc-800 focus:border-zinc-600 focus:outline-none text-sm resize-none"></textarea>
        </div>
        <div id="activity-done-block" class="hidden flex items-center gap-2 px-3 py-2 rounded-lg bg-zinc-950 border border-zinc-800">
          <input type="checkbox" id="activity-done-check" class="w-4 h-4 rounded accent-emerald-500" />
          <label for="activity-done-check" class="text-sm text-zinc-300 select-none cursor-pointer">Als erledigt markieren</label>
        </div>
        <div class="flex gap-2 pt-2">
          <button type="button" id="activity-delete-btn" onclick="deleteActivityFromModal()" class="hidden px-3 py-2 rounded-lg border border-red-500/30 text-red-400 hover:bg-red-500/10 transition-colors text-sm">Löschen</button>
          <button type="button" onclick="closeActivityModal()" class="flex-1 px-3 py-2 rounded-lg border border-zinc-800 hover:bg-zinc-800 transition-colors text-sm">Abbrechen</button>
          <button type="submit" class="flex-1 px-3 py-2 rounded-lg bg-white text-zinc-950 font-medium hover:bg-zinc-200 transition-colors text-sm">Speichern</button>
        </div>
      </form>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] hidden">
    <div class="bg-zinc-900 border border-zinc-800 rounded-xl shadow-2xl px-4 py-3 flex items-center gap-3 max-w-md">
      <span id="toast-message" class="text-sm text-zinc-200"></span>
      <button id="toast-action" class="hidden text-xs font-medium text-emerald-400 hover:text-emerald-300 transition-colors"></button>
    </div>
  </div>

</div>

<script>
// =============================================================
// CONFIG

function initSupabase() {
  if (SUPABASE_URL.startsWith('__') || SUPABASE_ANON_KEY.startsWith('__')) {
    showConfigError();
    return false;
  }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth: { persistSession: true, autoRefreshToken: true },
  });
  return true;
}

// =============================================================
// AUTH
// =============================================================
async function bootstrap() {
  if (!initSupabase()) return;
  const { data: { session } } = await sb.auth.getSession();
  if (session) await onSignedIn();
  else showLogin();
  sb.auth.onAuthStateChange(async (event, session) => {
    if (event === 'SIGNED_IN' && session) await onSignedIn();
    if (event === 'SIGNED_OUT') showLogin();
  });
}

async function onSignedIn() {
  state.authed = true;
  document.getElementById('login-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  await Promise.all([loadLeads(), loadActivities()]);
  render();
  subscribeRealtime();
  setInterval(render, 60_000);
}

function showLogin() {
  state.authed = false;
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-screen').classList.remove('hidden');
}

document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const submit = document.getElementById('login-submit');
  const err = document.getElementById('login-error');
  err.classList.add('hidden');
  submit.disabled = true;
  submit.textContent = 'Anmelden…';
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  submit.disabled = false;
  submit.textContent = 'Anmelden';
  if (error) {
    err.textContent = error.message === 'Invalid login credentials' ? 'Email oder Passwort falsch.' : error.message;
    err.classList.remove('hidden');
  }
});

document.getElementById('logout-btn').addEventListener('click', async () => { await sb.auth.signOut(); });

async function loadLeads() {
  const { data, error } = await sb.from('leads').select('*').order('created_at', { ascending: false });
  if (error) { console.error('[loadLeads]', error); toast('Fehler beim Laden: ' + error.message); return; }
  state.leads = data || [];
}

async function loadActivities() {
  const { data, error } = await sb.from('activities').select('*').order('scheduled_at', { ascending: true, nullsFirst: false });
  if (error) { console.error('[loadActivities]', error); toast('Aktivitäten-Fehler: ' + error.message); return; }
  state.activities = data || [];
}

async function loadNotes(leadId) {
  const { data, error } = await sb.from('notes').select('*').eq('lead_id', leadId).order('created_at', { ascending: false });
  if (error) { console.error('[loadNotes]', error); toast('Notizen-Fehler: ' + error.message); return; }
  state.notesByLead[leadId] = data || [];
}

async function createLead(fields) {
  console.log('[createLead]', fields);
  const { data, error } = await sb.from('leads').insert(fields).select().single();
  if (error) { console.error('[createLead] error', error); toast('Konnte Lead nicht anlegen: ' + error.message); return null; }
  if (data && !state.leads.find(l => l.id === data.id)) state.leads.unshift(data);
  render();
  return data;
}

async function updateLead(id, patch) {
  const { data, error } = await sb.from('leads').update(patch).eq('id', id).select().single();
  if (error) { console.error('[updateLead]', error); toast('Speichern fehlgeschlagen: ' + error.message); return null; }
  const i = state.leads.findIndex(l => l.id === id);
  if (i >= 0) state.leads[i] = data;
  return data;
}

async function softDeleteLead(id) { return await updateLead(id, { deleted_at: new Date().toISOString() }); }
async function restoreLead(id)    { return await updateLead(id, { deleted_at: null }); }

async function addNote(leadId, content) {

  if (data && !state.notesByLead[leadId].find(n => n.id === data.id)) state.notesByLead[leadId].unshift(data);

// =============================================================
function subscribeRealtime() {
  sb.channel('crm-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'leads' }, (payload) => {
      if (payload.eventType === 'INSERT') {
        if (!state.leads.find(l => l.id === payload.new.id)) state.leads.unshift(payload.new);
      } else if (payload.eventType === 'UPDATE') {
        const i = state.leads.findIndex(l => l.id === payload.new.id);
        if (i >= 0) state.leads[i] = payload.new; else state.leads.unshift(payload.new);
      } else if (payload.eventType === 'DELETE') {
        state.leads = state.leads.filter(l => l.id !== payload.old.id);
      }
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'activities' }, (payload) => {
      if (payload.eventType === 'INSERT') {
        if (!state.activities.find(a => a.id === payload.new.id)) state.activities.push(payload.new);
      } else if (payload.eventType === 'UPDATE') {
        const i = state.activities.findIndex(a => a.id === payload.new.id);
        if (i >= 0) state.activities[i] = payload.new; else state.activities.push(payload.new);
      } else if (payload.eventType === 'DELETE') {
        state.activities = state.activities.filter(a => a.id !== payload.old.id);
      }
      render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'notes' }, (payload) => {
      const leadId = payload.new?.lead_id || payload.old?.lead_id;
      if (!leadId || !state.notesByLead[leadId]) return;
      if (payload.eventType === 'INSERT') {
        if (!state.notesByLead[leadId].find(n => n.id === payload.new.id)) state.notesByLead[leadId].unshift(payload.new);
      } else if (payload.eventType === 'DELETE') {
        state.notesByLead[leadId] = state.notesByLead[leadId].filter(n => n.id !== payload.old.id);
      }
      if (state.selectedLeadId === leadId) renderNotes();
    })
    .subscribe((status) => {
      state.rtConnected = (status === 'SUBSCRIBED');
      updateRtIndicator();
    });
}

function updateRtIndicator() {
  const dot = document.getElementById('rt-dot');
  const label = document.getElementById('rt-label');
  if (state.rtConnected) { dot.className = 'w-1.5 h-1.5 rounded-full bg-emerald-500'; label.textContent = 'live'; }
  else                   { dot.className = 'w-1.5 h-1.5 rounded-full bg-zinc-600';     label.textContent = 'offline'; }
}

// HELPERS
// =============================================================
function activitiesOfLead(leadId) {
  return state.activities.filter(a => a.lead_id === leadId);
}
function openActivitiesOfLead(leadId) {
  return activitiesOfLead(leadId).filter(a => !a.done_at);
}
function doneActivitiesOfLead(leadId) {
  return activitiesOfLead(leadId).filter(a => a.done_at)
    .sort((a, b) => new Date(b.done_at) - new Date(a.done_at));
}
function nextOpenActivity(leadId) {
  const list = openActivitiesOfLead(leadId).filter(a => a.scheduled_at);
  if (!list.length) return null;
  return list.sort((a, b) => new Date(a.scheduled_at) - new Date(b.scheduled_at))[0];
}

function isLeadClosed(lead) { return ['gewonnen', 'verloren'].includes(lead.status); }

function activityState(activity) {
  if (activity.done_at) return 'done';
  if (!activity.scheduled_at) return 'unscheduled';
  const d = new Date(activity.scheduled_at), now = new Date();
  if (d < now) return 'overdue';
  const today = new Date(); today.setHours(0,0,0,0);
  const tomorrow = new Date(today); tomorrow.setDate(today.getDate()+1);
  if (d >= now && d < tomorrow) return 'today';
  const weekEnd = new Date(today); weekEnd.setDate(today.getDate()+7);
  if (d < weekEnd) return 'thisweek';
  return 'future';
}

function needsActivityWarning(lead) {
  if (!['nachfass', 'verhandlung'].includes(lead.status)) return false;
  return openActivitiesOfLead(lead.id).length === 0;
}

const dtfDate     = new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
const dtfDateTime = new Intl.DateTimeFormat('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
const dtfTime     = new Intl.DateTimeFormat('de-DE', { hour: '2-digit', minute: '2-digit' });
const dtfWeekday  = new Intl.DateTimeFormat('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

function formatDateTime(iso) { return iso ? dtfDateTime.format(new Date(iso)) : ''; }
function formatScheduled(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  const diffMs = d - now;
  const absHour = Math.abs(diffMs) / 3_600_000;
  if (absHour < 24 && d.getDate() === now.getDate() && d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear()) {
    return `Heute ${dtfTime.format(d)}`;
  }
  return dtfWeekday.format(d);
}
function formatRelative(iso) {
  if (!iso) return '';
  const d = new Date(iso), now = new Date();
  const diffMs = d - now, diffMin = Math.round(diffMs / 60_000);
  const absMin = Math.abs(diffMin);
  if (absMin < 1) return 'jetzt';
  if (absMin < 60) return diffMin > 0 ? `in ${absMin} Min` : `vor ${absMin} Min`;
  const diffHour = Math.round(diffMin / 60);
  if (Math.abs(diffHour) < 24) return diffHour > 0 ? `in ${diffHour} Std` : `vor ${Math.abs(diffHour)} Std`;
  const diffDay = Math.round(diffHour / 24);
  if (Math.abs(diffDay) < 30) return diffDay > 0 ? `in ${diffDay} Tg` : `vor ${Math.abs(diffDay)} Tg`;
  return dtfDate.format(d);
}

function normalizePhone(raw) {
  if (!raw) return '';
  let p = raw.replace(/[^\d+]/g, '');
  if (p.startsWith('00')) p = '+' + p.slice(2);
  if (p.startsWith('0')) p = '+49' + p.slice(1);
  if (!p.startsWith('+')) p = '+' + p;
  return p;
}
function waLink(raw) { const p = normalizePhone(raw); return p ? `https://wa.me/${p.replace('+','')}` : ''; }

function escapeHtml(str) {
  if (str == null) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function toLocalInputValue(iso) {
  if (!iso) return '';
  const d = new Date(iso), pad = (n) => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function fromLocalInputValue(s) { return s ? new Date(s).toISOString() : null; }

function quickDate(kind) {
  const d = new Date(); d.setSeconds(0); d.setMilliseconds(0);
  if (kind === 'tomorrow10') { d.setDate(d.getDate()+1); d.setHours(10,0); }
  else if (kind === 'in3days') { d.setDate(d.getDate()+3); d.setHours(10,0); }
  else if (kind === 'nextweek') { d.setDate(d.getDate()+7); d.setHours(10,0); }
  return d.toISOString();
}

function toast(message, action) {
  const t = document.getElementById('toast');
  document.getElementById('toast-message').textContent = message;
  const btn = document.getElementById('toast-action');
  if (action) {
    btn.textContent = action.label;
    btn.classList.remove('hidden');
    btn.onclick = () => { hideToast(); action.onClick(); };
  } else {
    btn.classList.add('hidden');
    btn.onclick = null;
  }
  t.classList.remove('hidden');
  clearTimeout(toast._timer);
  toast._timer = setTimeout(hideToast, action ? 8000 : 3500);
}
function hideToast() { document.getElementById('toast').classList.add('hidden'); }

// =============================================================
// FILTERING + SORTING
// =============================================================
function visibleLeads() {
  const q = state.search.trim().toLowerCase();
  let arr = state.leads.filter(l => {
    if (state.filter === 'archiv') return !!l.deleted_at;
    if (l.deleted_at) return false;
    if (state.filter === 'aktiv') return !isLeadClosed(l);
    return l.status === state.filter;
  });
  if (q) {
    arr = arr.filter(l => {
      const hay = [l.firma, l.branche, l.kontaktperson, l.telefon, l.email].filter(Boolean).join(' ').toLowerCase();
      return hay.includes(q);
    });
  }
  arr.sort((a, b) => {
    const aNext = nextOpenActivity(a.id), bNext = nextOpenActivity(b.id);
    const rank = (lead, nx) => {
      if (nx) {
        const s = activityState(nx);
        if (s === 'overdue') return 0;
        if (s === 'today') return 1;
        if (s === 'thisweek') return 2;
        return 3;
      }
      return 4;
    };
    const ra = rank(a, aNext), rb = rank(b, bNext);
    if (ra !== rb) return ra - rb;
    if (aNext && bNext) return new Date(aNext.scheduled_at) - new Date(bNext.scheduled_at);
    return new Date(b.updated_at) - new Date(a.updated_at);
  });
  return arr;
}

function render() {
  renderAlerts();
  renderFilterTabs();
  renderLeadList();
  if (state.selectedLeadId) renderLeadDetail();
}

function renderAlerts() {
  const activeLeadIds = new Set(state.leads.filter(l => !l.deleted_at && !isLeadClosed(l)).map(l => l.id));
  const opens = state.activities.filter(a => !a.done_at && activeLeadIds.has(a.lead_id));
  const overdue = opens.filter(a => activityState(a) === 'overdue').sort((a,b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));
  const today = opens.filter(a => activityState(a) === 'today').sort((a,b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));
  const thisweek = opens.filter(a => activityState(a) === 'thisweek').sort((a,b) => new Date(a.scheduled_at) - new Date(b.scheduled_at));

  const el = document.getElementById('alerts');
  if (overdue.length === 0 && today.length === 0 && thisweek.length === 0) {
    el.innerHTML = `
      <div class="rounded-2xl border border-zinc-900 bg-zinc-900/30 p-5 sm:p-6 flex items-center gap-4">
        <div class="w-10 h-10 rounded-xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center">
          <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
        </div>
        <div>
          <p class="font-medium">Alle Aktivitäten im Griff</p>
          <p class="text-sm text-zinc-500">Keine offenen Termine für heute oder diese Woche.</p>
        </div>
      </div>`;
    return;
  }

  const card = (kind, title, items, color) => {
    if (items.length === 0) return '';
    const list = items.slice(0, 5).map(a => {
      const lead = state.leads.find(l => l.id === a.lead_id);
      if (!lead) return '';
      return `
        <button onclick="selectLead('${lead.id}')" class="w-full text-left flex items-center justify-between gap-2 py-1.5 hover:bg-white/5 rounded-md px-2 -mx-2 transition-colors">
          <span class="min-w-0 flex-1">
            <span class="text-sm font-medium truncate block">${escapeHtml(a.titel)}</span>
            <span class="text-[11px] text-zinc-500 truncate block">${escapeHtml(lead.firma)}</span>
          </span>
          <span class="text-xs text-zinc-500 shrink-0">${escapeHtml(formatRelative(a.scheduled_at))}</span>
        </button>`;
    }).join('');
    const more = items.length > 5 ? `<p class="text-xs text-zinc-500 pt-2 pl-2">+ ${items.length - 5} weitere</p>` : '';
    return `
      <div class="rounded-2xl border ${color.border} ${color.bg} p-4 sm:p-5 ${kind === 'overdue' ? 'animate-pulse-red' : ''}">
        <div class="flex items-center justify-between mb-3">
          <h3 class="font-semibold ${color.title}">${escapeHtml(title)}</h3>
          <span class="text-2xl font-bold ${color.count}">${items.length}</span>
        </div>
        <div class="space-y-0.5">${list}${more}</div>
      </div>`;
  };

  el.innerHTML = `
    <div class="grid gap-3 grid-cols-1 sm:grid-cols-2 lg:grid-cols-3">
      ${card('overdue', 'Überfällig', overdue, { border: 'border-red-500/30', bg: 'bg-red-500/5', title: 'text-red-300', count: 'text-red-400' })}
      ${card('today', 'Heute fällig', today, { border: 'border-amber-500/30', bg: 'bg-amber-500/5', title: 'text-amber-300', count: 'text-amber-400' })}
      ${card('week', 'Diese Woche', thisweek, { border: 'border-zinc-800', bg: 'bg-zinc-900/30', title: 'text-zinc-300', count: 'text-zinc-200' })}
    </div>`;
}

function renderFilterTabs() {
  const el = document.getElementById('filter-tabs');
  const counts = {};
  counts.aktiv = state.leads.filter(l => !l.deleted_at && !isLeadClosed(l)).length;
  for (const s of STATUS_LIST) counts[s.key] = state.leads.filter(l => !l.deleted_at && l.status === s.key).length;
  counts.archiv = state.leads.filter(l => l.deleted_at).length;

  el.innerHTML = FILTER_TABS.map(t => {
    const isActive = state.filter === t.key;
    const count = counts[t.key] || 0;
    return `
      <button data-filter="${t.key}" class="shrink-0 px-3 py-1.5 rounded-lg text-sm font-medium transition-colors flex items-center gap-2 ${isActive ? 'bg-white text-zinc-950' : 'bg-zinc-900 text-zinc-300 hover:bg-zinc-800 border border-zinc-800'}">
        ${escapeHtml(t.label)}
        <span class="text-xs text-zinc-500">${count}</span>
      </button>`;
  }).join('');
  el.querySelectorAll('button[data-filter]').forEach(btn => {
    btn.addEventListener('click', () => { state.filter = btn.dataset.filter; render(); });
  });
}

function renderLeadList() {
  const el = document.getElementById('lead-list');
  const empty = document.getElementById('lead-list-empty');
  const list = visibleLeads();

  if (list.length === 0) {
    el.innerHTML = '';
    empty.classList.remove('hidden');
    const total = state.leads.length;
    document.getElementById('empty-title').textContent = total === 0 ? 'Noch keine Leads' : (state.search ? 'Keine Treffer' : 'Diese Spalte ist leer');
    document.getElementById('empty-sub').textContent = total === 0
      ? 'Lege den ersten Lead an, sobald die Website-Erstellung startet.'
      : (state.search ? `Keine Leads gefunden für „${state.search}".` : 'Wechsle den Filter oder lege einen neuen Lead an.');
    return;
  }
  empty.classList.add('hidden');

  el.innerHTML = list.map(l => {
    const s = STATUS_MAP[l.status] || STATUS_MAP.in_arbeit;
    const next = nextOpenActivity(l.id);
    const nState = next ? activityState(next) : null;
    const cardBorder = nState === 'overdue' ? 'border-red-500/50 ring-1 ring-red-500/30 animate-pulse-red'
                    : nState === 'today'   ? 'border-amber-500/40'
                    : 'border-zinc-800 hover:border-zinc-700';
    const activityBadge = next
      ? `<span class="text-xs ${nState==='overdue'?'text-red-400':nState==='today'?'text-amber-400':'text-zinc-400'} truncate"><span class="font-medium">${escapeHtml(next.titel)}</span> · ${escapeHtml(formatRelative(next.scheduled_at))}</span>`
      : (needsActivityWarning(l) ? `<span class="text-xs text-yellow-400 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86l-8.18 14.18A2 2 0 003.83 21h16.34a2 2 0 001.72-2.96L13.71 3.86a2 2 0 00-3.42 0z"/></svg>Keine Aktivität</span>` : '');

    const tel = normalizePhone(l.telefon);
    const telBtn = tel ? `<a href="tel:${tel}" onclick="event.stopPropagation()" class="p-1.5 rounded-md hover:bg-zinc-800 transition-colors" title="Anrufen"><svg class="w-4 h-4 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h2.28a2 2 0 011.94 1.515l.7 2.79a2 2 0 01-.46 1.87L7.91 10.91a16 16 0 005.18 5.18l1.74-1.55a2 2 0 011.87-.46l2.79.7A2 2 0 0121 16.72V19a2 2 0 01-2 2A18 18 0 013 5z"/></svg></a>` : '';

    return `
      <article onclick="selectLead('${l.id}')" class="cursor-pointer rounded-xl border ${cardBorder} bg-zinc-900/40 hover:bg-zinc-900/70 p-4 transition-all">
        <div class="flex items-start justify-between gap-3 mb-2">
          <div class="min-w-0 flex-1">
            <h3 class="font-semibold truncate">${escapeHtml(l.firma)}</h3>
            ${l.kontaktperson ? `<p class="text-sm text-zinc-400 truncate">${escapeHtml(l.kontaktperson)}</p>` : ''}
          </div>
          ${telBtn}
        </div>
        <div class="flex items-center justify-between gap-2 mt-3 min-w-0">
          <span class="px-2 py-0.5 rounded-md text-xs font-medium border ${s.color} shrink-0">${escapeHtml(s.label)}</span>
          <div class="min-w-0 text-right">${activityBadge}</div>
        </div>
        ${l.branche ? `<p class="text-xs text-zinc-500 mt-3 truncate">${escapeHtml(l.branche)}</p>` : ''}
      </article>`;
  }).join('');
}

// LEAD DETAIL
// =============================================================
async function selectLead(id) {
  state.selectedLeadId = id;
  state.showDoneActivities = false;
  const panel = document.getElementById('lead-detail');
  panel.classList.remove('hidden');
  gsap.fromTo(panel,
    { opacity: 0, x: window.innerWidth >= 640 ? 40 : 0, y: window.innerWidth < 640 ? 40 : 0 },
    { opacity: 1, x: 0, y: 0, duration: 0.25, ease: 'power2.out' });
  document.body.style.overflow = 'hidden';
  if (!state.notesByLead[id]) await loadNotes(id);
  renderLeadDetail();
}

function closeLeadDetail() {
  state.selectedLeadId = null;
  document.getElementById('lead-detail').classList.add('hidden');
  document.body.style.overflow = '';
}

function getSelectedLead() { return state.leads.find(l => l.id === state.selectedLeadId); }

function renderLeadDetail() {
  const lead = getSelectedLead();
  if (!lead) return;

  setIfDifferent('detail-firma', lead.firma || '');
  setIfDifferent('detail-branche', lead.branche || '');
  setIfDifferent('detail-kontaktperson', lead.kontaktperson || '');
  setIfDifferent('detail-telefon', lead.telefon || '');
  setIfDifferent('detail-email', lead.email || '');
  setIfDifferent('detail-alte-website', lead.alte_website || '');
  setIfDifferent('detail-website-url', lead.website_url || '');

  // Status buttons
  const statusEl = document.getElementById('detail-status-buttons');
  statusEl.innerHTML = STATUS_LIST.map(s => {
    const active = lead.status === s.key;
    return `<button data-status="${s.key}" class="px-2 py-2 rounded-md text-xs font-medium border transition-colors ${active ? s.color : 'bg-zinc-900 text-zinc-400 border-zinc-800 hover:border-zinc-700'}">${escapeHtml(s.label)}</button>`;
  }).join('');
  statusEl.querySelectorAll('button[data-status]').forEach(btn => {
    btn.addEventListener('click', () => changeStatus(btn.dataset.status));
  });

  renderActivities();

  // Quick actions
  const qa = document.getElementById('detail-quick-actions');
  const tel = normalizePhone(lead.telefon), wa = waLink(lead.telefon);
  qa.innerHTML = `
    ${tel ? `<a href="tel:${tel}" class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg bg-zinc-900 border border-zinc-800 hover:border-zinc-700 text-sm transition-colors">📞 <span>Anruf</span></a>` : `<div class="flex items-center justify-center px-3 py-2.5 rounded-lg bg-zinc-900/50 border border-zinc-800 text-sm text-zinc-600">📞</div>`}
    ${wa ? `<a href="${wa}" target="_blank" rel="noopener" class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg bg-zinc-900 border border-zinc-800 hover:border-zinc-700 text-sm transition-colors">💬 <span>WhatsApp</span></a>` : `<div class="flex items-center justify-center px-3 py-2.5 rounded-lg bg-zinc-900/50 border border-zinc-800 text-sm text-zinc-600">💬</div>`}
    ${lead.email ? `<a href="mailto:${escapeHtml(lead.email)}" class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg bg-zinc-900 border border-zinc-800 hover:border-zinc-700 text-sm transition-colors">✉ <span>Email</span></a>` : `<div class="flex items-center justify-center px-3 py-2.5 rounded-lg bg-zinc-900/50 border border-zinc-800 text-sm text-zinc-600">✉</div>`}
    ${lead.website_url ? `<a href="${escapeHtml(lead.website_url)}" target="_blank" rel="noopener" class="flex items-center justify-center gap-2 px-3 py-2.5 rounded-lg bg-zinc-900 border border-zinc-800 hover:border-zinc-700 text-sm transition-colors">🔗 <span>Website</span></a>` : `<div class="flex items-center justify-center px-3 py-2.5 rounded-lg bg-zinc-900/50 border border-zinc-800 text-sm text-zinc-600">🔗</div>`}
  `;

  // Delete/restore
  const dr = document.getElementById('delete-restore-area');
  if (lead.deleted_at) {
    dr.innerHTML = `
      <div class="flex flex-col gap-2">
        <p class="text-xs text-zinc-500 mb-1">Archiviert am ${escapeHtml(formatDateTime(lead.deleted_at))}</p>
        <button onclick="doRestoreLead()" class="w-full px-3 py-2 rounded-lg bg-emerald-500/10 border border-emerald-500/30 hover:bg-emerald-500/20 text-emerald-400 text-sm font-medium transition-colors">Wiederherstellen</button>
      </div>`;
  } else {
    dr.innerHTML = `<button onclick="doSoftDeleteLead()" class="w-full px-3 py-2 rounded-lg border border-red-500/30 text-red-400 hover:bg-red-500/10 text-sm font-medium transition-colors">Lead löschen</button>`;
  }

  renderNotes();
}

function renderActivities() {
  const lead = getSelectedLead();
  if (!lead) return;
  const opens = openActivitiesOfLead(lead.id).sort((a, b) => {
    if (a.scheduled_at && !b.scheduled_at) return -1;
    if (!a.scheduled_at && b.scheduled_at) return 1;
    if (!a.scheduled_at && !b.scheduled_at) return new Date(a.created_at) - new Date(b.created_at);
    return new Date(a.scheduled_at) - new Date(b.scheduled_at);
  });
  const dones = doneActivitiesOfLead(lead.id);

  const warnEl = document.getElementById('activities-warning');
  if (needsActivityWarning(lead)) {
    warnEl.innerHTML = `<div class="mb-3 p-2.5 rounded-lg bg-yellow-500/10 border border-yellow-500/30 text-yellow-300 text-xs flex items-center gap-2">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M10.29 3.86l-8.18 14.18A2 2 0 003.83 21h16.34a2 2 0 001.72-2.96L13.71 3.86a2 2 0 00-3.42 0z"/></svg>
      Status ${escapeHtml(STATUS_MAP[lead.status].label)} ohne offene Aktivität — jemand vergessen?
    </div>`;
  } else {
    warnEl.innerHTML = '';
  }

  const openEl = document.getElementById('activities-open');
  if (opens.length === 0) {
    openEl.innerHTML = `<p class="text-sm text-zinc-500 py-2">Keine offenen Aktivitäten.</p>`;
  } else {
    openEl.innerHTML = opens.map(renderActivityCard).join('');
    openEl.querySelectorAll('[data-activity-card]').forEach(el => {
      el.addEventListener('click', (e) => {
        if (e.target.closest('[data-activity-action]')) return;
        openActivityModal(el.dataset.activityCard);
      });
    });
    openEl.querySelectorAll('[data-activity-action="done"]').forEach(el => {
      el.addEventListener('click', async (e) => {
        e.stopPropagation();
        await markActivityDone(el.dataset.id);
      });
    });
  }

  const doneToggle = document.getElementById('activities-done-toggle');
  const doneList = document.getElementById('activities-done');
  const doneLabel = document.getElementById('activities-done-label');
  const doneChevron = document.getElementById('activities-done-chevron');
  if (dones.length === 0) {
    doneToggle.classList.add('hidden');
    doneList.classList.add('hidden');
  } else {
    doneToggle.classList.remove('hidden');
    doneLabel.textContent = state.showDoneActivities ? `${dones.length} erledigte ausblenden` : `${dones.length} erledigte anzeigen`;
    doneChevron.style.transform = state.showDoneActivities ? 'rotate(90deg)' : '';
    if (state.showDoneActivities) {
      doneList.classList.remove('hidden');
      doneList.innerHTML = dones.map(renderDoneActivityRow).join('');
      doneList.querySelectorAll('[data-activity-card]').forEach(el => {
        el.addEventListener('click', () => openActivityModal(el.dataset.activityCard));
      });
    } else {
      doneList.classList.add('hidden');
    }
  }
}

function renderActivityCard(a) {
  const aState = activityState(a);
  const tone = aState === 'overdue' ? { ring: 'border-red-500/40 bg-red-500/5', date: 'text-red-400', pulse: 'animate-pulse-red' }
            : aState === 'today'   ? { ring: 'border-amber-500/40 bg-amber-500/5', date: 'text-amber-400', pulse: '' }
            : aState === 'thisweek'? { ring: 'border-zinc-800 bg-zinc-900/50', date: 'text-zinc-300', pulse: '' }
            : aState === 'unscheduled' ? { ring: 'border-zinc-800 bg-zinc-900/50', date: 'text-zinc-500', pulse: '' }
            : { ring: 'border-zinc-800 bg-zinc-900/50', date: 'text-zinc-400', pulse: '' };
  const dateLabel = a.scheduled_at
    ? `${escapeHtml(formatScheduled(a.scheduled_at))} · ${escapeHtml(formatRelative(a.scheduled_at))}`
    : 'Kein Datum';
  const noteHtml = a.note ? `<p class="text-xs text-zinc-400 mt-1.5 whitespace-pre-wrap break-words line-clamp-3">${escapeHtml(a.note)}</p>` : '';
  return `
    <div data-activity-card="${a.id}" class="cursor-pointer rounded-lg border ${tone.ring} ${tone.pulse} p-3 hover:border-zinc-600 transition-colors">
      <div class="flex items-start gap-3">
        <button data-activity-action="done" data-id="${a.id}" class="mt-0.5 w-4 h-4 rounded border border-zinc-600 hover:border-emerald-500 hover:bg-emerald-500/20 transition-colors shrink-0" title="Als erledigt markieren"></button>
        <div class="min-w-0 flex-1">
          <p class="text-sm font-medium text-zinc-100 break-words">${escapeHtml(a.titel)}</p>
          <p class="text-xs ${tone.date} mt-0.5">${dateLabel}</p>
          ${noteHtml}
        </div>
      </div>
    </div>`;
}

function renderDoneActivityRow(a) {
  const noteHtml = a.note ? `<p class="text-xs text-zinc-500 mt-0.5 line-clamp-1 break-words">${escapeHtml(a.note)}</p>` : '';
  return `
    <div data-activity-card="${a.id}" class="cursor-pointer flex items-start gap-2 px-2 py-1.5 rounded-md hover:bg-zinc-900 transition-colors">
      <svg class="w-3.5 h-3.5 text-emerald-500 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>
      <div class="min-w-0 flex-1">
        <p class="text-sm text-zinc-300 truncate"><span class="line-through text-zinc-500">${escapeHtml(a.titel)}</span></p>
        ${noteHtml}
      </div>
      <span class="text-[10px] text-zinc-600 shrink-0 mt-1">${escapeHtml(formatRelative(a.done_at))}</span>
    </div>`;
}

function toggleDoneActivities() {
  state.showDoneActivities = !state.showDoneActivities;
  renderActivities();
}

function setIfDifferent(id, value) {
  const el = document.getElementById(id);
  if (!el) return;
  if (document.activeElement === el) return;
  if (el.value !== value) el.value = value;
}

function renderNotes() {
  const lead = getSelectedLead();
  if (!lead) return;
  const notes = state.notesByLead[lead.id] || [];
  const el = document.getElementById('notes-timeline');
  if (notes.length === 0) {
    el.innerHTML = '<p class="text-sm text-zinc-500">Noch keine allgemeinen Notizen.</p>';
    return;
  }
  el.innerHTML = notes.map(n => `
    <div class="group flex items-start gap-3 py-2 px-3 rounded-lg bg-zinc-900/50 border border-zinc-900 hover:border-zinc-800 transition-colors">
      <div class="w-1.5 h-1.5 rounded-full bg-zinc-600 mt-2 shrink-0"></div>
      <div class="flex-1 min-w-0">
        <p class="text-sm text-zinc-200 whitespace-pre-wrap break-words">${escapeHtml(n.content)}</p>
        <p class="text-[11px] text-zinc-500 mt-1" title="${escapeHtml(formatDateTime(n.created_at))}">${escapeHtml(formatRelative(n.created_at))}</p>
      </div>
      <button onclick="doDeleteNote('${n.id}','${lead.id}')" class="opacity-0 group-hover:opacity-100 p-1 rounded-md hover:bg-zinc-800 transition-opacity shrink-0" title="Notiz löschen">
        <svg class="w-3.5 h-3.5 text-zinc-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6M1 7h22M9 7V4a2 2 0 012-2h2a2 2 0 012 2v3"/></svg>
      </button>
    </div>`).join('');
}

// =============================================================
// EDIT HANDLERS (Auto-Save)
// =============================================================
const FIELD_MAP = {
  'detail-firma': 'firma',
  'detail-branche': 'branche',
  'detail-kontaktperson': 'kontaktperson',
  'detail-telefon': 'telefon',
  'detail-email': 'email',
  'detail-alte-website': 'alte_website',
  'detail-website-url': 'website_url',
};

Object.keys(FIELD_MAP).forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => queueSave(id));
  el.addEventListener('blur', () => flushSave(id));
});

function queueSave(id) { clearTimeout(state.saveTimers[id]); state.saveTimers[id] = setTimeout(() => flushSave(id), 600); }

async function flushSave(id) {
  clearTimeout(state.saveTimers[id]); delete state.saveTimers[id];
  const lead = getSelectedLead();
  if (!lead) return;
  const field = FIELD_MAP[id];
  const value = document.getElementById(id).value;
  if ((lead[field] || '') === value) return;
  await updateLead(lead.id, { [field]: value || null });
  showSaved();
  if (id === 'detail-firma') renderLeadList();
}

function showSaved() {
  const el = document.getElementById('detail-saved');
  el.textContent = '✓ Gespeichert';
  clearTimeout(showSaved._t);
  showSaved._t = setTimeout(() => el.textContent = '', 1500);
}

async function changeStatus(newStatus) {
  const lead = getSelectedLead();
  if (!lead || lead.status === newStatus) return;
  await updateLead(lead.id, { status: newStatus });
  showSaved();
  render();
}

async function doSoftDeleteLead() {
  const lead = getSelectedLead();
  if (!lead) return;
  await softDeleteLead(lead.id);
  const deletedId = lead.id;
  closeLeadDetail();
  render();
  toast('Lead archiviert', { label: 'Rückgängig', onClick: async () => {
    await restoreLead(deletedId);
    render();
  }});
}

async function doRestoreLead() {
  const lead = getSelectedLead();
  if (!lead) return;
  await restoreLead(lead.id);
  render();
  toast('Lead wiederhergestellt');
}

async function doDeleteNote(noteId, leadId) {
  await deleteNote(noteId, leadId);
  renderNotes();
}

document.getElementById('add-note-btn').addEventListener('click', submitNote);
document.getElementById('new-note-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); submitNote(); }
});

async function submitNote() {
  const lead = getSelectedLead();
  if (!lead) return;
  const input = document.getElementById('new-note-input');
  const content = input.value.trim();
  if (!content) return;
  input.value = '';
  await addNote(lead.id, content);
  renderNotes();
}

// ADD LEAD
// =============================================================
function openAddLead() {
  document.getElementById('add-lead-modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('new-firma').focus(), 50);
}
function closeAddLead() {
  document.getElementById('add-lead-modal').classList.add('hidden');
  document.getElementById('add-lead-form').reset();
}
document.getElementById('new-lead-btn').addEventListener('click', openAddLead);

document.getElementById('add-lead-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fields = {
    firma: document.getElementById('new-firma').value.trim(),
    branche: document.getElementById('new-branche').value.trim() || null,
    kontaktperson: document.getElementById('new-kontaktperson').value.trim() || null,
    telefon: document.getElementById('new-telefon').value.trim() || null,
    email: document.getElementById('new-email').value.trim() || null,
    alte_website: document.getElementById('new-alte-website').value.trim() || null,
    website_url: document.getElementById('new-website-url').value.trim() || null,
    status: 'in_arbeit',
  };
  if (!fields.firma) {
    toast('Bitte Firma eingeben.');
    document.getElementById('new-firma').focus();
    return;
  }
  try {
    const lead = await createLead(fields);
    if (lead) {
      closeAddLead();
      await selectLead(lead.id);
    }
  } catch (err) {
    console.error('[add-lead]', err);
    toast('Fehler beim Anlegen: ' + (err.message || err));
  }
});

// =============================================================
// ACTIVITY MODAL
// =============================================================
function openActivityModal(activityId) {
  const lead = getSelectedLead();
  if (!lead) return;
  state.editingActivityId = activityId || null;
  const isEdit = !!activityId;
  document.getElementById('activity-modal-title').textContent = isEdit ? 'Aktivität bearbeiten' : 'Neue Aktivität';
  document.getElementById('activity-delete-btn').classList.toggle('hidden', !isEdit);
  document.getElementById('activity-done-block').classList.toggle('hidden', !isEdit);

  if (isEdit) {
    const a = state.activities.find(x => x.id === activityId);
    if (!a) return;
    document.getElementById('activity-titel').value = a.titel || '';
    document.getElementById('activity-scheduled-at').value = toLocalInputValue(a.scheduled_at);
    document.getElementById('activity-note').value = a.note || '';
    document.getElementById('activity-done-check').checked = !!a.done_at;
  } else {
    document.getElementById('activity-form').reset();
    document.getElementById('activity-done-check').checked = false;
  }

  document.getElementById('activity-modal').classList.remove('hidden');
  setTimeout(() => document.getElementById('activity-titel').focus(), 50);
}

function closeActivityModal() {
  document.getElementById('activity-modal').classList.add('hidden');
  state.editingActivityId = null;
}

document.querySelectorAll('[data-activity-quick]').forEach(btn => {
  btn.addEventListener('click', () => {
    const kind = btn.dataset.activityQuick;
    document.getElementById('activity-scheduled-at').value = kind === 'clear' ? '' : toLocalInputValue(quickDate(kind));
  });
});

document.getElementById('activity-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const lead = getSelectedLead();
  if (!lead) return;
  const titel = document.getElementById('activity-titel').value.trim();
  if (!titel) { toast('Bitte einen Titel angeben.'); return; }
  const scheduledRaw = document.getElementById('activity-scheduled-at').value;
  const note = document.getElementById('activity-note').value.trim() || null;
  const isDone = document.getElementById('activity-done-check').checked;
  const fields = {
    titel,
    scheduled_at: fromLocalInputValue(scheduledRaw),
    note,
  };
  if (state.editingActivityId) {
    const current = state.activities.find(a => a.id === state.editingActivityId);
    fields.done_at = isDone ? (current?.done_at || new Date().toISOString()) : null;
    await updateActivity(state.editingActivityId, fields);
  } else {
    fields.lead_id = lead.id;
    if (isDone) fields.done_at = new Date().toISOString();
    await createActivity(fields);
  }
  closeActivityModal();
  render();
});

async function deleteActivityFromModal() {
  if (!state.editingActivityId) return;
  if (!confirm('Aktivität wirklich löschen?')) return;
  await deleteActivity(state.editingActivityId);
  closeActivityModal();
  render();
}

async function markActivityDone(id) {
  await updateActivity(id, { done_at: new Date().toISOString() });
  render();
}

document.getElementById('export-btn').addEventListener('click', async () => {
  menuDd.classList.add('hidden');
  const [{ data: leads }, { data: notes }, { data: activities }] = await Promise.all([
    sb.from('leads').select('*').order('created_at'),
    sb.from('notes').select('*').order('created_at'),
    sb.from('activities').select('*').order('created_at'),
  ]);
  const blob = new Blob([JSON.stringify({ exported_at: new Date().toISOString(), leads: leads || [], notes: notes || [], activities: activities || [] }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `semp-crm-export-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('Export heruntergeladen');
});

// KEYBOARD SHORTCUTS
// =============================================================
document.addEventListener('keydown', (e) => {
  if (!state.authed) return;
  const tag = e.target.tagName.toLowerCase();
  const isInput = tag === 'input' || tag === 'textarea' || e.target.isContentEditable;
  if (e.key === 'Escape') {
    if (!document.getElementById('activity-modal').classList.contains('hidden')) { closeActivityModal(); return; }
    if (!document.getElementById('add-lead-modal').classList.contains('hidden')) { closeAddLead(); return; }
    if (state.selectedLeadId) { closeLeadDetail(); return; }
  }
  if (isInput) return;
  if (e.key === '/') { e.preventDefault(); searchInput.focus(); }
  if (e.key === 'n') { e.preventDefault(); openAddLead(); }
  if (e.key === 'a' && state.selectedLeadId) { e.preventDefault(); openActivityModal(); }
});

// =============================================================
// BOOT
// =============================================================
bootstrap();
</script>
</body>
</html>
